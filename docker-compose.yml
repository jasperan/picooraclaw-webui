version: "3.9"

services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: picooraclaw-oracle
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD to a unique database password}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'select 1 from dual;' | sqlplus -s system/${ORACLE_PWD:?Set ORACLE_PWD}@//localhost:1521/FREEPDB1 | grep -q '^\\s*1$$'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  picooraclaw:
    image: ghcr.io/jasperan/picooraclaw:latest
    container_name: picooraclaw-core
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORACLE_DSN: "system/${ORACLE_PWD:?Set ORACLE_PWD}@oracle:1521/FREEPDB1"
      PICOORACLAW_IPC: "/tmp/picooraclaw.sock"
    volumes:
      - picooraclaw-sock:/tmp
    restart: unless-stopped

  webui:
    build: .
    container_name: picooraclaw-webui
    depends_on:
      - picooraclaw
    environment:
      PICOORACLAW_IPC: "/tmp/picooraclaw.sock"
      # The binary reads PICOORACLAW_WEBUI_LISTEN and PICOORACLAW_WEBUI_PASSWORD (config.go:24-25).
      # The previous PORT variable was never read by anything, and without a password the server
      # refuses to start: a non-loopback bind with no password is the combination the fail-closed
      # guard blocks, so `docker compose up` could never bring this service up.
      PICOORACLAW_WEBUI_LISTEN: ":3000"
      PICOORACLAW_WEBUI_PASSWORD: ${WEBUI_PASSWORD:?Set WEBUI_PASSWORD for the browser login}
    volumes:
      - picooraclaw-sock:/tmp
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  oracle-data:
  picooraclaw-sock:
